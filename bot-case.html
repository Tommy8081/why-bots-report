<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root{
    --ink:#101319; --ink2:#4b5263; --ink3:#8b93a4;
    --line:#e2e6ef; --card:#fff;
    --blue:#2f6bff; --violet:#7c5cff; --orange:#ff8a3d; --green:#19a974;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:1600px; padding:44px 56px 30px;
    background:
      radial-gradient(1100px 420px at 10% -8%, #e8eeff 0%, rgba(232,238,255,0) 70%),
      radial-gradient(900px 380px at 96% 4%, #fdeee6 0%, rgba(253,238,230,0) 70%),
      #f5f7fb;
    color:var(--ink); font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  }
  header{display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:18px; border-bottom:2px solid var(--line)}
  h1{font-size:40px; line-height:1.1; letter-spacing:.5px}
  h1 span{color:var(--orange)}
  .sub{font-size:17px; color:var(--ink2); margin-top:8px}
  .meta{font-size:13.5px; color:var(--ink3); text-align:right; line-height:1.7}

  /* 六步 */
  .pipe{position:relative; display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-top:26px}
  .pipe::before{content:""; position:absolute; left:6%; right:6%; top:46px; height:2px; background:repeating-linear-gradient(90deg,#d3dae8 0 8px,transparent 8px 16px)}
  .step{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:0}
  .ring{width:92px;height:92px;border-radius:50%; display:grid; place-items:center; background:var(--card); border:2px solid var(--c); box-shadow:0 10px 24px rgba(16,19,25,.06); z-index:2}
  .ring svg{width:42px;height:42px; color:var(--c)}
  .step .no{position:absolute; top:-8px; left:50%; transform:translateX(24px); width:26px;height:26px;border-radius:50%; background:var(--c); color:#fff; font-size:13px; font-weight:800; display:grid; place-items:center; z-index:3}
  .step .t{font-size:17px; font-weight:800; margin-top:14px}
  .step .s{font-size:12.5px; color:var(--ink3); margin-top:5px}
  .step .who{margin-top:9px; font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px; background:color-mix(in srgb, var(--c) 12%, #fff); color:var(--c)}

  /* 前后 */
  .pair{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:30px}
  .pcard{background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:18px 22px 16px}
  .pcard.now{border-color:#c9d6ff; box-shadow:0 14px 34px rgba(47,107,255,.10)}
  .ph{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .ph .pt{font-size:19px; font-weight:800}
  .ph .badge{margin-left:auto; font-size:11.5px; font-weight:800; padding:5px 11px; border-radius:999px}
  .badge.g{background:#eef0f5;color:#5f6776} .badge.b{background:#e7eeff;color:#1b3ea8}
  .ph .big{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
  .ph .big svg{width:22px;height:22px}
  .big.g{background:#f0f1f5;color:#6b7382} .big.b{background:#e7eeff;color:var(--blue)}
  .pline{font-size:13.5px; color:var(--ink3); margin-bottom:12px}

  .mock{display:flex; gap:22px; align-items:center; justify-content:space-between}
  .sidebar{width:226px; border:1.5px solid var(--line); border-radius:14px; padding:10px 10px 9px; background:#fafbfe; display:flex; flex-direction:column; gap:6px; flex:none}
  .sline{height:11px; border-radius:6px; background:#e9edf5}
  .sline.w85{width:85%} .sline.w70{width:70%}
  .sbot{height:32px; border-radius:10px; background:#eef2fa; display:flex; align-items:center; gap:7px; padding:0 8px}
  .sbot .av{width:16px;height:16px;border-radius:5px;background:#c9d6ff}
  .sbot .nm{height:8px; width:60px; border-radius:4px; background:#d8e0ef}
  .ghost{margin-top:auto; height:54px; border-radius:12px; border:1.5px dashed #cfd7e6; display:grid; place-items:center; font-size:11.5px; color:#9aa3b4}
  .real{margin-top:auto; border-radius:12px; padding:8px 10px; background:linear-gradient(180deg,#f2f6ff,#fff); border:1.5px solid #c9d6ff; display:flex; flex-direction:column; gap:5px}
  .real .row{display:flex; align-items:baseline; justify-content:space-between}
  .real .l{font-size:10.5px; color:#7b8496}
  .real .v{font-size:14px; font-weight:800; color:var(--ink)}
  .real .v.blue{color:var(--blue)}
  .track{height:4px;border-radius:2px;background:#e4e9f5;overflow:hidden}
  .fill{height:100%;width:33%;border-radius:2px;background:linear-gradient(90deg,#ffb37a,#ff8a3d)}
  .btns{display:flex; gap:7px; margin-top:2px}
  .btn{width:26px;height:26px;border-radius:8px;background:#e9edf5;border:1px solid #dbe2ee}
  .mnote{font-size:13.5px; color:var(--ink2); line-height:1.6}
  .mnote b{color:var(--ink)}

  .bottom{margin-top:22px; background:#11151f; color:#eef1f7; border-radius:18px; padding:19px 28px; display:flex; align-items:center; gap:18px}
  .bottom .k{font-size:13px; letter-spacing:3px; color:#8e9bb6; flex:none}
  .bottom .q{font-size:22px; font-weight:700; line-height:1.35}
  .bottom .q em{font-style:normal; color:#8fb2ff}
</style>
</head>
<body>
  <header>
    <div>
      <h1>一次真实落地：<span>加一张费用卡</span></h1>
      <div class="sub">六个环节，六个人分工</div>
    </div>
    <div class="meta">AI Agent 进展汇报 · 3 / 4<br/>2026-11-20</div>
  </header>

  <div class="pipe">
    <div class="step" style="--c:#2f6bff">
      <div class="no">1</div>
      <div class="ring"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M10 12h28v18H22l-8 7v-7h-4z" stroke-linejoin="round"/></svg></div>
      <div class="t">提需求</div>
      <div class="s">我要一张卡</div>
      <div class="who">我</div>
    </div>
    <div class="step" style="--c:#7c5cff">
      <div class="no">2</div>
      <div class="ring"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="21" cy="21" r="11"/><path d="M29 29l9 9" stroke-linecap="round"/></svg></div>
      <div class="t">查现成</div>
      <div class="s">上游没做过</div>
      <div class="who">研究</div>
    </div>
    <div class="step" style="--c:#ff8a3d">
      <div class="no">3</div>
      <div class="ring"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M10 34V18a4 4 0 014-4h20l-4-4M38 14v16a4 4 0 01-4 4H14l4 4"/></svg></div>
      <div class="t">量清楚</div>
      <div class="s">宽 0、被压住</div>
      <div class="who">实现</div>
    </div>
    <div class="step" style="--c:#ff8a3d">
      <div class="no">4</div>
      <div class="ring"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M26 8l14 14-16 16H10V24z" stroke-linejoin="round"/><path d="M20 14l14 14"/></svg></div>
      <div class="t">写插件</div>
      <div class="s">本地出数</div>
      <div class="who">实现</div>
    </div>
    <div class="step" style="--c:#19a974">
      <div class="no">5</div>
      <div class="ring"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="24" cy="24" r="16"/><path d="M16 24l6 6 11-12" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t">换人验收</div>
      <div class="s">数字对得上</div>
      <div class="who">评审</div>
    </div>
    <div class="step" style="--c:#2f6bff">
      <div class="no">6</div>
      <div class="ring"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M24 38V12M14 20l10-10 10 10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t">回馈上游</div>
      <div class="s">issue #545</div>
      <div class="who">Chief</div>
    </div>
  </div>

  <div class="pair">
    <div class="pcard">
      <div class="ph">
        <div class="big g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h6"/></svg></div>
        <div class="pt">之前</div>
        <div class="badge g">卡片在，看不见</div>
      </div>
      <div class="pline">侧栏只有两个圆钮</div>
      <div class="mock">
        <div class="sidebar">
          <div class="sline w85"></div><div class="sline w70"></div>
          <div class="sbot"><div class="av"></div><div class="nm"></div></div>
          <div class="ghost">看不见</div>
          <div class="btns"><div class="btn"></div><div class="btn"></div></div>
        </div>
        <div class="mnote">数据一直在记，<br/>只是没地方显示。</div>
      </div>
    </div>

    <div class="pcard now">
      <div class="ph">
        <div class="big b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/><path d="M7 17h4"/></svg></div>
        <div class="pt">之后</div>
        <div class="badge b">嵌进侧栏</div>
      </div>
      <div class="pline">跟着列表一起排版</div>
      <div class="mock">
        <div class="sidebar">
          <div class="sline w85"></div><div class="sline w70"></div>
          <div class="sbot"><div class="av"></div><div class="nm"></div></div>
          <div class="real">
            <div class="row"><span class="l">余额</span><span class="v">¥98.13</span></div>
            <div class="row"><span class="l">今日</span><span class="v blue">¥2.1024</span></div>
            <div class="row"><span class="l">平价</span><span class="l">11小时后高峰</span></div>
            <div class="track"><div class="fill"></div></div>
          </div>
          <div class="btns"><div class="btn"></div><div class="btn"></div></div>
        </div>
        <div class="mnote">不飘在窗口上，<br/>回到传统界面自动隐藏。</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="k">一句话</div>
    <div class="q">一个人也能做完，但做不到<em>换人验收</em>。</div>
  </div>
</body>
</html>
